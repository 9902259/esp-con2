name: Test, build and release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: host/python/requirements.txt
      - name: Test Python CLI and MCP
        run: |
          python -m pip install -r host/python/requirements.txt
          python -m unittest discover -s host/python/tests -t host/python -p 'test_*.py'
      - name: Package Python source
        if: runner.os == 'Linux'
        run: python scripts/package.py python
      - uses: actions/upload-artifact@v7.0.2
        if: runner.os == 'Linux'
        with:
          name: release-python
          path: build/release/esp-con2-python.zip
          if-no-files-found: error

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: host/javascript/example/package-lock.json
      - name: Build TypeScript example and API
        run: make web-build
      - name: Test JavaScript API
        run: node --test 'host/javascript/tests/*.test.mjs'
      - name: Package website
        run: python3 scripts/package.py web
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-web
          path: build/release/esp-con2-web.zip
          if-no-files-found: error

  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      # Use current stable Python for both firmware and host tooling.
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15'
      - name: Install SDK prerequisites
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libusb-1.0-0
      - name: Install pinned firmware dependencies
        env:
          ESP_CON2_IDF_PYTHON: python3.15
        run: bash firmware/scripts/dependencies.sh
      - name: Build unified ESP32-S3 firmware
        run: make firmware
      - name: Package firmware
        run: python scripts/package.py firmware
      # Sticky uses GPIO19/20 for its microphone, so ship a UART-only image too.
      - name: Build and package reTerminal Sticky firmware
        env:
          ESP_CON2_BOARD: sticky
        run: |
          make firmware
          python scripts/package.py firmware
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-firmware
          path: build/release/esp-con2-firmware*.zip
          if-no-files-found: error

  release:
    needs: [host, web, firmware]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: assets
      - name: Publish release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd assets
          sha256sum ./*.zip > SHA256SUMS
          # Stage assets in a draft so a failed upload cannot expose a partial release.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG" --draft
          fi
          gh release upload "$RELEASE_TAG" ./*.zip SHA256SUMS --clobber
          prerelease=false
          # v0.0.1 is the initial beta despite its plain version tag.
          if [[ "$RELEASE_TAG" == *-* || "$RELEASE_TAG" == v0.0.1 ]]; then prerelease=true; fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease"
